name: Update contribution calendar
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: source-activity
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test generator
        run: python3 -m unittest discover -s tests -v
      - name: Verify live contribution request (no commit)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_activity.py
  update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_activity.py
      - name: Commit changed calendar
        run: |
          if git diff --quiet -- assets/contribution-graph.svg; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contribution-graph.svg
          git commit -m 'Update contribution calendar'
          git push

